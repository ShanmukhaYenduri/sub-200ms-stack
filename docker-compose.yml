# sub-200ms-stack -- local stack
# Postgres, Redis, Kafka (KRaft, no ZooKeeper), the API and the consumer.
# Images are pinned so the numbers in bench/RESULTS.md stay reproducible.

services:
  postgres:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_USER: metrics
      POSTGRES_PASSWORD: metrics
      POSTGRES_DB: metrics
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    command:
      # Deliberate, minimal tuning so EXPLAIN plans are stable between runs.
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "track_io_timing=on"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrics -d metrics"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    # maxmemory + LRU: a runaway cache should degrade, not take the box down.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: ["node", "src/server.js"]
    environment:
      PORT: "3000"
      DATABASE_URL: "postgres://metrics:metrics@postgres:5432/metrics"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "metric-events"
      JWT_SECRET: "local-dev-only-not-a-real-secret"
      CACHE_TTL_SECONDS: "30"
      # Raised well above the production-shaped default of 300/60s, and only
      # here. Every request in a k6 run arrives from one address, so a per-IP
      # limit that is realistic makes the benchmark a measurement of the token
      # bucket instead of the read path. The limiter is still on and still
      # exercised; it is just not the narrowest thing in the pipe.
      RATE_LIMIT_MAX: "60000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  consumer:
    build: .
    command: ["node", "src/consumer.js"]
    environment:
      DATABASE_URL: "postgres://metrics:metrics@postgres:5432/metrics"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "metric-events"
      # The consumer never verifies a token, but src/config.js validates the whole
      # environment on load and refuses to start on a missing variable. That is the
      # trade: one config module for both processes, and both have to satisfy it.
      JWT_SECRET: "local-dev-only-not-a-real-secret"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
